services:
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: ntfy
    command:
      - serve

    volumes:
      - /opt/data/ntfy:/var/lib/ntfy

    ports:
      - "${NTFY_PORT}:2586"

    restart: unless-stopped

    init: true

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --tries=1 http://localhost:2586/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
