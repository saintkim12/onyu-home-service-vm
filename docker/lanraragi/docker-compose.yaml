services:
  # ============================================================
  # LANraragi
  # ============================================================
  lanraragi:
    image: difegue/lanraragi:v.0.9.81
    container_name: lanraragi

    # 직접 포트 공개하지 않음.
    # Caddy를 통해서만 접근.
    expose:
      - "3000"

    environment:
      - LRR_AUTOFIX_PERMISSIONS=-1
      - LRR_UID=${PUID}
      - LRR_GID=${PGID}

    volumes:
      # MinIO -> rclone
      - /mnt/lanraragi-s3:/home/koyomi/lanraragi/content

      # 로컬 영구 데이터
      - /opt/localdata/lanraragi/thumb:/home/koyomi/lanraragi/thumb
      - /opt/localdata/lanraragi/database:/home/koyomi/lanraragi/database

    restart: unless-stopped

    networks:
      - lanraragi_net


  # ============================================================
  # Caddy
  #
  # 유일한 외부 진입점.
  # Basic Auth 후 LANraragi로 reverse proxy.
  # ============================================================
  caddy:
    image: caddy:2-alpine
    container_name: lanraragi-caddy

    depends_on:
      - lanraragi

    ports:
      - "${LANRARAGI_PORT}:80"

    volumes:
      - /opt/localdata/lanraragi/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/localdata/lanraragi/caddy/data:/data
      - /opt/localdata/lanraragi/caddy/config:/config

    restart: unless-stopped

    networks:
      - lanraragi_net


networks:
  lanraragi_net:
    driver: bridge